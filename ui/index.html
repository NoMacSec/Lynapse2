<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lynapse 2.0</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="titlebar" data-tauri-drag-region>
  <div id="tabs" data-tauri-drag-region></div>
  <div id="winctl">
    <button id="wmin" title="Minimize"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.3"><path d="M2 8.5h12"/></svg></button>
    <button id="wmax" title="Maximize"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="2.5" width="11" height="11"/></svg></button>
    <button id="wclose" class="close" title="Close"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.3"><path d="M2.5 2.5l11 11M13.5 2.5l-11 11"/></svg></button>
  </div>
</div>
<div id="nav">
  <div class="left">
    <button class="iconbtn" id="back" title="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="iconbtn" id="fwd" title="Forward"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="iconbtn" id="refresh" title="Refresh"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
  </div>
  <div class="title" id="title"></div>
  <div class="right">
    <button class="iconbtn na"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="10" height="10"/><rect x="10" y="10" width="10" height="10" fill="#1a1a1a"/></svg></button>
    <button class="iconbtn na"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg></button>
    <button class="iconbtn" id="gear" title="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    <button class="iconbtn" id="help" title="About Lynapse 2.0"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><text x="12" y="16.5" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">?</text></svg></button>
  </div>
</div>
<div id="sub">
  <div class="profile" id="profile"></div>
  <div id="subtabs"></div>
  <div class="statusR" id="status"></div>
</div>
<div id="content"></div>
<div id="natip">Not added yet</div>
<div id="toast"></div>
<div id="modal"></div>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
