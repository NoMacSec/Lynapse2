[package]
name = "razerctl"
version = "2.0.0"
description = "Synapse-style control app for Razer devices on Linux"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
parking_lot = "0.12"
evdev = "0.13"
zbus = "5"
png = "0.18"
tiny-skia = "0.11"
fontdue = "0.9"

[profile.release]
opt-level = 3
lto = "thin"

[patch.crates-io]
# hover text for the tray icon on Linux (see vendor/tray-icon/LYNAPSE-PATCH.md)
tray-icon = { path = "vendor/tray-icon" }
